<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Тестер реле — ESP8266</title>
  <style>
    :root {
      --bg: #0b1220;
      --bg-glow: rgba(56, 130, 246, 0.18);
      --card: #131c2e;
      --border: #24314d;
      --text: #e8eefc;
      --muted: #8ea0c0;
      --accent: #38bdf8;
      --ok: #34d399;
      --warn: #fbbf24;
      --err: #f87171;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(1200px 500px at 80% -10%, var(--bg-glow), transparent 60%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 48px;
      line-height: 1.45;
    }
    .wrap { max-width: 460px; margin: 0 auto; }
    header { margin-bottom: 14px; }
    h1 { font-size: 22px; font-weight: 700; }
    .muted { color: var(--muted); font-size: 13px; margin-top: 4px; }

    .card {
      background: linear-gradient(180deg, var(--card), #101827);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
    }
    .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .hint { font-size: 13px; color: var(--muted); margin-bottom: 12px; }

    /* ---------- индикатор текущего пина ---------- */
    .now {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-bottom: 14px;
    }
    .now .gpio { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .now .gpio small { font-size: 15px; color: var(--muted); font-weight: 500; }
    .dot {
      width: 18px; height: 18px; border-radius: 50%;
      background: #2a3854; transition: background .15s, box-shadow .15s;
    }
    .dot.on { background: var(--ok); box-shadow: 0 0 14px rgba(52, 211, 153, .8); }
    .state { font-size: 13px; color: var(--muted); }

    .row { display: flex; gap: 10px; }
    button {
      flex: 1; padding: 12px 16px; border: 0; border-radius: 12px;
      font-size: 15px; font-weight: 600; color: #fff; cursor: pointer;
      transition: filter .2s, transform .1s;
    }
    button:hover { filter: brightness(1.1); }
    button:active { transform: translateY(1px); }
    button:disabled { filter: grayscale(.6); opacity: .5; cursor: default; }
    .btn-go { background: linear-gradient(135deg, #059669, #34d399); }
    .btn-stop { background: linear-gradient(135deg, #dc2626, #f87171); }

    /* ---------- ручные импульсы ---------- */
    .pins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .pin-btn {
      padding: 14px 8px; font-size: 16px; font-weight: 700;
      background: #1a2740; color: var(--text);
      border: 1px solid var(--border); border-radius: 12px;
    }
    .pin-btn small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); margin-top: 2px; }
    .pin-btn.active { border-color: var(--ok); color: var(--ok); }
    #log { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: var(--muted); margin-top: 12px; min-height: 1em; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Тестер реле</h1>
      <div class="muted">ESP8266 · сеть <b>relay-test</b> · 192.168.4.1</div>
    </header>

    <div class="card">
      <h2>Авто-сканирование</h2>
      <div class="hint">Устройство по очереди подаёт HIGH на каждый пин на 1.5 с.
        Следите за реле: когда щёлкнет — смотрите, какой сейчас GPIO.</div>
      <div class="now">
        <div class="gpio" id="gpio">— <small>GPIO</small></div>
        <div class="dot" id="dot"></div>
      </div>
      <div class="state" id="state">остановлено</div>
      <div class="row" style="margin-top:12px">
        <button class="btn-go" id="btnStart" type="button">Старт</button>
        <button class="btn-stop" id="btnStop" type="button">Стоп</button>
      </div>
    </div>

    <div class="card">
      <h2>Ручной импульс</h2>
      <div class="hint">Кнопка — щелчок одного реле (HIGH на 0.8 с).</div>
      <div class="pins">
        <button class="pin-btn" data-pin="4"  type="button">GPIO 4<small>импульс</small></button>
        <button class="pin-btn" data-pin="5"  type="button">GPIO 5<small>импульс</small></button>
        <button class="pin-btn" data-pin="12" type="button">GPIO 12<small>импульс</small></button>
        <button class="pin-btn" data-pin="13" type="button">GPIO 13<small>импульс</small></button>
        <button class="pin-btn" data-pin="14" type="button">GPIO 14<small>импульс</small></button>
        <button class="pin-btn" data-pin="16" type="button">GPIO 16<small>импульс</small></button>
      </div>
      <div id="log"></div>
    </div>
  </div>

  <script>
    function post(url) {
      return fetch(url, { method: 'POST' }).then(function(res) { return res.json(); });
    }

    function poll() {
      fetch('/status').then(function(res) { return res.json(); }).then(function(s) {
        var gpioEl = document.getElementById('gpio');
        var dot = document.getElementById('dot');
        var state = document.getElementById('state');
        if (s.running && s.pin > 0) {
          gpioEl.innerHTML = s.pin + ' <small>GPIO</small>';
          dot.className = 'dot on';
          state.textContent = 'сканирую… цикл ' + s.cycle + ' — какое реле щёлкнуло?';
        } else {
          gpioEl.innerHTML = '— <small>GPIO</small>';
          dot.className = 'dot';
          state.textContent = s.running ? 'сканирую…' : 'остановлено';
        }
        document.getElementById('btnStart').disabled = !!s.running;
        document.getElementById('btnStop').disabled = !s.running;
      }).catch(function() {});
    }
    poll();
    setInterval(poll, 500);

    document.getElementById('btnStart').onclick = function() { post('/start'); poll(); };
    document.getElementById('btnStop').onclick = function() { post('/stop'); poll(); };

    Array.prototype.forEach.call(document.querySelectorAll('.pin-btn'), function(btn) {
      btn.onclick = function() {
        var pin = btn.getAttribute('data-pin');
        fetch('/pulse', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'pin=' + pin
        }).then(function(res) { return res.json(); }).then(function(r) {
          var log = document.getElementById('log');
          log.textContent = r.ok
            ? 'импульс на GPIO ' + r.pin
            : 'ошибка: ' + (r.error || '?');
        }).catch(function() {});
      };
    });
  </script>
</body>
</html>
