<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>DS18B20 — мониторинг и настройка</title>
  <style>
    :root {
      --bg: #0b1220;
      --bg-glow: rgba(56, 130, 246, 0.18);
      --card: #131c2e;
      --border: #24314d;
      --text: #e8eefc;
      --muted: #8ea0c0;
      --accent-t: #f59e0b;
      --ok: #34d399;
      --warn: #fbbf24;
      --err: #f87171;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(1200px 500px at 80% -10%, var(--bg-glow), transparent 60%),
        radial-gradient(900px 400px at -10% 110%, rgba(167, 139, 250, 0.12), transparent 60%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 48px;
      line-height: 1.45;
    }
    .wrap { max-width: 460px; margin: 0 auto; }

    /* ---------- шапка ---------- */
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .title h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.3px; }
    .title .dev { font-size: 13px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .badge {
      flex-shrink: 0; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--card); color: var(--muted); white-space: nowrap;
      transition: color .3s, border-color .3s, background .3s;
    }
    .badge.ok   { color: var(--ok);   border-color: rgba(52, 211, 153, .4); background: rgba(52, 211, 153, .08); }
    .badge.warn { color: var(--warn); border-color: rgba(251, 191, 36, .4); background: rgba(251, 191, 36, .08); }
    .badge.err  { color: var(--err);  border-color: rgba(248, 113, 113, .4); background: rgba(248, 113, 113, .08); }

    .updated { font-size: 12px; color: var(--muted); margin-bottom: 16px; }

    /* ---------- карточки показаний ---------- */
    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 22px; }
    @media (min-width: 380px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    .sensor {
      background: linear-gradient(180deg, var(--card), #101827);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      position: relative; overflow: hidden;
      transition: transform .15s ease, border-color .3s;
    }
    .sensor::before {
      content: ""; position: absolute; inset: 0 0 auto 0; height: 3px;
      background: var(--accent, var(--muted)); opacity: .9;
    }
    .sensor.t { --accent: var(--accent-t); }
    .sensor .top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .sensor .icon {
      width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
      background: rgba(142, 160, 192, .12);
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      color: var(--accent);
    }
    .sensor .name { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; }
    .sensor .value { font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .sensor .value.tick { animation: tick .5s ease; }
    @keyframes tick { 0% { color: var(--accent); } 100% { color: var(--text); } }
    .sensor .unit { font-size: 13px; color: var(--muted); font-weight: 500; }
    .sensor .sub { font-size: 12px; color: var(--muted); margin-top: 4px; min-height: 1em; }
    #empty {
      display: none; border: 1px dashed var(--border); border-radius: var(--radius);
      padding: 22px 16px; text-align: center; color: var(--muted); font-size: 14px;
    }

    /* ---------- форма ---------- */
    .card {
      background: linear-gradient(180deg, var(--card), #101827);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
    }
    .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .card .hint { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 5px; letter-spacing: .3px; }
    input {
      width: 100%; font-size: 16px; padding: 11px 12px; border-radius: 10px;
      background: #0d1526; color: var(--text);
      border: 1px solid var(--border); outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, .18); }
    input::placeholder { color: #55648a; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button {
      width: 100%; margin-top: 18px; padding: 13px 16px; border: 0; border-radius: 12px;
      font-size: 16px; font-weight: 600; color: #fff; cursor: pointer;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      box-shadow: 0 6px 18px rgba(59, 130, 246, .28);
      transition: filter .2s, transform .1s;
    }
    button:hover { filter: brightness(1.1); }
    button:active { transform: translateY(1px); }
    button:disabled { filter: grayscale(.5); opacity: .6; cursor: default; }
    #status { min-height: 1.3em; margin-top: 12px; font-size: 13px; color: var(--ok); text-align: center; }
    #status.err { color: var(--err); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">
        <h1>DS18B20</h1>
        <div class="dev" id="dev">—</div>
      </div>
      <div class="badge err" id="badge">загрузка…</div>
    </header>
    <div class="updated" id="updated">данные ещё не получены</div>

    <div class="grid" id="grid"></div>
    <div id="empty">Датчики не найдены. Проверьте линию 1-Wire: data → GPIO4, подтяжка 4.7 кОм к 3.3 V.</div>

    <div class="card">
      <h2>Подключение к роутеру и MQTT</h2>
      <div class="hint">После сохранения устройство перезагрузится и подключится к вашей сети. Если не получится — точка доступа поднимется снова.</div>
      <form id="f" autocomplete="off">
        <label for="sta_ssid">Сеть роутера (SSID)</label>
        <input id="sta_ssid" name="sta_ssid" required maxlength="32" placeholder="Домашний WiFi">
        <label for="sta_pass">Пароль роутера</label>
        <input id="sta_pass" name="sta_pass" type="password" maxlength="63" placeholder="••••••••">
        <div class="two">
          <div>
            <label for="mqtt_server">MQTT-сервер</label>
            <input id="mqtt_server" name="mqtt_server" maxlength="127" placeholder="192.168.1.10:1883">
          </div>
          <div>
            <label for="mqtt_user">MQTT пользователь</label>
            <input id="mqtt_user" name="mqtt_user" maxlength="32">
          </div>
        </div>
        <label for="mqtt_pass">MQTT пароль</label>
        <input id="mqtt_pass" name="mqtt_pass" type="password" maxlength="63">
        <button type="submit" id="btn">Сохранить и перезагрузить</button>
      </form>
      <p id="status"></p>
    </div>
  </div>

  <script>
    var lastSensorTs = 0;
    var cfgFirstLoad = true;
    var cards = {};   // id датчика -> { val, sub }

    var ICON_THERMO = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4a2 2 0 1 0-4 0v9.2a4.5 4.5 0 1 0 4 0z"/><circle cx="12" cy="17.5" r="1.5" fill="currentColor" stroke="none"/></svg>';

    function ensureCard(id) {
      if (cards[id]) return cards[id];
      var card = document.createElement('div');
      card.className = 'sensor t';
      card.innerHTML = '<div class="top"><span class="icon">' + ICON_THERMO +
        '</span><span class="name">Температура</span></div>' +
        '<div><span class="value">—</span> <span class="unit">°C</span></div>' +
        '<div class="sub"></div>';
      document.getElementById('grid').appendChild(card);
      cards[id] = { val: card.querySelector('.value'), sub: card.querySelector('.sub') };
      return cards[id];
    }

    function removeCard(id) {
      var c = cards[id];
      if (!c) return;
      c.val.closest('.sensor').remove();
      delete cards[id];
    }

    function comfortNote(t) {
      if (t === null || t === undefined || t !== t) return '';
      if (t < 18) return 'холодно';
      if (t > 26) return 'жарко';
      return 'комфортно';
    }

    function setValEl(el, v) {
      if (v === null || v === undefined || v !== v) { el.textContent = '—'; return; }
      var txt = Number(v).toFixed(1);
      if (el.textContent !== txt) {
        el.textContent = txt;
        el.classList.remove('tick');
        void el.offsetWidth; // перезапуск анимации
        el.classList.add('tick');
      }
    }

    function poll() {
      fetch('/sensor').then(function(res) { return res.json(); }).then(function(data) {
        var s = data.sensors || {};
        var keys = Object.keys(s).sort();
        var empty = document.getElementById('empty');

        // убрать карточки датчиков, которых больше нет на шине
        Object.keys(cards).forEach(function(id) {
          if (keys.indexOf(id) < 0) removeCard(id);
        });

        empty.style.display = keys.length ? 'none' : 'block';
        keys.forEach(function(id) {
          var c = ensureCard(id);
          setValEl(c.val, s[id]);
          var note = comfortNote(s[id]);
          c.sub.textContent = id + (note ? ' · ' + note : '');
        });
        lastSensorTs = Date.now();
      }).catch(function() {});
    }
    poll();
    setInterval(poll, 3000);

    setInterval(function() {
      var el = document.getElementById('updated');
      if (!lastSensorTs) { el.textContent = 'данные ещё не получены'; return; }
      var sec = Math.round((Date.now() - lastSensorTs) / 1000);
      el.textContent = sec < 2 ? 'обновлено только что' : 'обновлено ' + sec + ' с назад';
    }, 1000);

    function applyCfg(cfg) {
      document.getElementById('dev').textContent = cfg.dev || '';
      if (cfgFirstLoad) {
        cfgFirstLoad = false;
        document.getElementById('sta_ssid').value = cfg.sta_ssid || '';
        document.getElementById('sta_pass').value = cfg.sta_pass || '';
        document.getElementById('mqtt_server').value = cfg.mqtt_server || '';
        document.getElementById('mqtt_user').value = cfg.mqtt_user || '';
        document.getElementById('mqtt_pass').value = cfg.mqtt_pass || '';
      }
      var b = document.getElementById('badge');
      if (cfg.sta_connected) {
        b.className = 'badge ok';
        b.textContent = 'онлайн · ' + (cfg.sta_ip || '');
      } else if (cfg.sta_on && cfg.ap_on) {
        b.className = 'badge warn';
        b.textContent = 'нет связи · AP включён';
      } else if (cfg.ap_on) {
        b.className = 'badge warn';
        b.textContent = 'режим настройки';
      } else {
        b.className = 'badge err';
        b.textContent = 'подключение…';
      }
    }

    function pollCfg() {
      fetch('/config').then(function(res) { return res.json(); }).then(applyCfg).catch(function() {});
    }
    pollCfg();
    setInterval(pollCfg, 10000);

    document.getElementById('f').onsubmit = function(e) {
      e.preventDefault();
      var s = document.getElementById('status');
      var btn = document.getElementById('btn');
      s.className = '';
      s.textContent = 'Сохранение…';
      btn.disabled = true;
      var body = new URLSearchParams(new FormData(document.getElementById('f')));
      fetch('/setup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body.toString()
      }).then(function(res) { return res.json(); }).then(function(r) {
        if (r.ok) {
          s.textContent = 'Сохранено. Устройство перезагружается — подключитесь к своему роутеру.';
        } else {
          s.className = 'err';
          s.textContent = 'Ошибка: ' + (r.error || 'неизвестная');
          btn.disabled = false;
        }
      }).catch(function() {
        s.className = 'err';
        s.textContent = 'Нет ответа (устройство уже перезагружается?)';
      });
      return false;
    };
  </script>
</body>
</html>
