author: mongoose-os
description: DS18B20 + MQTT + Web UI (settings in mos.yml)
version: 1.0
manifest_version: 2017-09-29

libs_version: ${mos.version}
modules_version: ${mos.version}
mongoose_os_version: ${mos.version}

tags:
  - js

sources:
  - src

filesystem:
  - fs

libs:
  - origin: https://github.com/mongoose-os-libs/boards
  - origin: https://github.com/mongoose-os-libs/ca-bundle
  - origin: https://github.com/mongoose-os-libs/rpc-service-config
  - origin: https://github.com/mongoose-os-libs/rpc-service-fs
  - origin: https://github.com/mongoose-os-libs/rpc-uart
  - origin: https://github.com/mongoose-os-libs/js-demo-bundle
  - origin: https://github.com/mongoose-os-libs/mqtt
  - origin: https://github.com/mongoose-os-libs/ds18b20

config_schema:
  - ["wifi.sta.enable", true]
  - ["wifi.sta.ssid", "CCF9"]
  - ["wifi.sta.pass", "cTo8BP6F11111112"]
  - ["wifi.ap.enable", false]
  - ["wifi.ap.ssid", "ds18b20"]
  - ["wifi.ap.pass", "ds18b20"]
  - ["http.index_files", "index.html"]

  - ["mqtt.enable", true]
  - ["mqtt.server", "tcp://89.125.28.27:1883"]
  - ["mqtt.user", "temphum"]
  - ["mqtt.pass", "cto8bp6f+CTO8BP6F"]
  - ["mqtt.client_id", "esp8266_ds18b20"]
  - ["mqtt.reconnect_timeout_min", 2]
  - ["mqtt.reconnect_timeout_max", 60]

  - ["aws.shadow.enable", false]

  - ["ds18b20.enable", true]
  - ["ds18b20.pin", 4]
